<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SyncReact</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">

    <!-- Aquí irá el logotipo -->
    <div class="logo">
        <h1>SyncReact</h1>
    </div>

</header>

<main>

    <!-- =========================
         VIDEO ORIGINAL
    ========================== -->

    <section class="setup">

        <input
            id="videoA"
            type="text"
            placeholder="Pega aquí la URL de YouTube">

        <button id="loadVideo">
            Cargar video
        </button>

    </section>



    <!-- =========================
         VIDEOS
    ========================== -->

    <section class="videos">

        <div class="video-panel">

            <div id="playerA"></div>

        </div>



        <div class="video-panel">

            <video
                id="playerB"
                autoplay
                muted
                playsinline>
            </video>

        </div>

    </section>



    <!-- =========================
         CONTROLES
    ========================== -->

    <section class="controls">

        <button id="startCam">
            📷 Activar cámara
        </button>

        <button
            id="startReaction"
            disabled>

            ▶️ Iniciar reacción

        </button>

        <button
            id="downloadReaction"
            disabled>

            ⬇️ Descargar reacción

        </button>

    </section>



    <!-- =========================
         ADS
    ========================== -->

    <section class="ads">

        Ads Placeholder

    </section>

</main>


<!-- =========================
     YOUTUBE API
========================= -->

<script src="https://www.youtube.com/iframe_api"></script>


<!-- =========================
     APP PRINCIPAL
========================= -->

<script type="module" src="src/app.js"></script>

</body>

</html>
